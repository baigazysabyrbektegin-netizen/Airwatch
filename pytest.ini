[pytest]
# Unified configuration for running everything from the repository root:
#   backend\.venv\Scripts\python.exe -m pytest
# `backend` is on the path so tests can `import app`; the repo root so they can `import pipeline`.
# backend/pytest.ini and pipeline/pytest.ini still apply when a suite is run on its own.
testpaths = backend/tests pipeline/tests
pythonpath = . backend
